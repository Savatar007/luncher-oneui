plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.luncher'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.luncher"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        // Compose compiler 1.5.14 is the release paired with Kotlin 1.9.24.
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui:1.6.11'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.11'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.splashscreen:splashscreen:1.0.1'

    // Material icons live in the compose material group, not material3.
    implementation 'androidx.compose.material:material-icons-extended:1.6.11'

    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.11'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.6.11'
}
